<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NorthernKnife Creative Hub</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="NK Hub">
<meta name="theme-color" content="#0b0c0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Uncial+Antiqua&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=102a0ca2e3">
</head>
<body>

<div id="lock">
  <div class="lock-card">
    <img src="img/logo-white.png" alt="NorthernKnife" style="width:200px">
    <div class="sub">Creative Hub · Performance &amp; Growth</div>
    <form id="loginForm" class="hidden" autocomplete="on">
      <input type="text" name="username" value="nk-creative-hub" autocomplete="username" hidden>
      <input type="password" id="pwIn" placeholder="Team password" autocomplete="current-password">
      <label><input type="checkbox" id="pwKeep" checked> Keep me signed in on this device</label>
      <button class="btn" id="loginBtn" type="submit" style="width:100%">Enter the hub</button>
    </form>
    <div id="lockErr" style="color:var(--muted);margin-top:12px;min-height:18px">Loading...</div>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="side-head">
      <img class="logo" src="img/logo-white.png" alt="NorthernKnife">
      <div class="tag">Creative Hub</div>
    </div>
    <nav id="nav"></nav>
    <div class="ctrl">
      <h4>Control panel</h4>
      <div class="field"><label>Market</label><div class="seg" id="cMarket"></div></div>
      <div class="field"><label>Attribution model</label><div class="seg" id="cModel"></div></div>
      <div class="field"><label>Min spend to rank: <span id="cMinV"></span></label><input type="range" id="cMin" min="0" max="3000" step="50"></div>
      <div class="field"><label>Good ROAS (green) from</label><select id="cTarget"><option value="auto">Auto: account average</option><option value="1.5">1.5</option><option value="1.75">1.75</option><option value="2">2.0</option><option value="2.5">2.5</option><option value="3">3.0</option></select></div>
    </div>
    <div class="side-foot">
      <div><span class="dot"></span>Live from Triple Whale</div>
      <div id="genAt" style="margin-top:4px"></div>
      <div style="margin-top:8px"><button class="btn ghost sm" id="shareBtn">Copy link to this view</button></div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="pill" id="roleTag"></span><button class="btn ghost sm" id="logoutBtn">Log out</button></div>
    </div>
  </aside>
  <main>
    <div class="topbar"><button class="btn ghost sm" id="menuBtn">☰ Menu</button><img class="logo" src="img/logo-white.png" alt="NorthernKnife"><span style="width:60px"></span></div>
    <div id="view"></div>
  </main>
</div>
<div id="scrim"></div>
<aside id="drawer"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>/* always load the newest code: browsers and GitHub Pages cache app.js otherwise */
(function(){var t=Date.now();var l=document.createElement('link');l.rel='stylesheet';l.href='styles.css?t='+t;document.head.appendChild(l);
var s=document.createElement('script');s.src='app.js?t='+t;document.body.appendChild(s);})();</script>
</body>
</html>
