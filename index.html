<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NorthernKnife Creative Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141416'/%3E%3Cpath d='M18 48 L44 14 L48 18 L24 50 Z' fill='%23c7b48b'/%3E%3Crect x='14' y='46' width='14' height='5' rx='2' transform='rotate(-52 21 48)' fill='%23c12f27'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="lock">
  <div class="lock-card">
    <div class="wordmark">NORTHERN<span>KNIFE</span></div>
    <div class="sub">Creative Hub · Performance &amp; Growth</div>
    <div id="lockErr" style="color:var(--muted)">Loading the latest numbers...</div>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="side-head">
      <div class="wordmark">NORTHERN<span>KNIFE</span></div>
      <div class="tag">Creative Hub</div>
    </div>
    <nav id="nav"></nav>
    <div class="ctrl">
      <h4>Control panel</h4>
      <div class="field"><label>Week</label><select id="cWeek"></select></div>
      <div class="field"><label>Market</label><div class="seg" id="cMarket"></div></div>
      <div class="field"><label>Attribution model</label><div class="seg" id="cModel"></div></div>
      <div class="field"><label>Currency</label><div class="seg" id="cCur"></div></div>
      <div class="field"><label>Min spend to rank: <span id="cMinV"></span></label><input type="range" id="cMin" min="0" max="3000" step="50"></div>
    </div>
    <div class="side-foot">
      <div><span class="dot"></span>Live from Triple Whale</div>
      <div id="genAt" style="margin-top:4px"></div>
      <div style="margin-top:8px"><button class="btn ghost sm" id="shareBtn">Copy link to this view</button></div>
    </div>
  </aside>
  <main>
    <div class="topbar"><button class="btn ghost sm" id="menuBtn">☰ Menu</button><div class="wordmark">NORTHERN<span>KNIFE</span></div><span></span></div>
    <div id="view"></div>
  </main>
</div>
<div id="scrim"></div>
<aside id="drawer"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
